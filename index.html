<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETRO PIXEL ADVENTURE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10152c;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{
 padding:15px;background:#171f42;
 color:#00f5ff;font-size:25px;font-weight:bold;
 letter-spacing:3px;
}
#game{
 display:block;width:100%;max-width:960px;
 margin:15px auto 5px;background:#75d9ff;
 border:4px solid #00eaff;border-radius:8px;
 image-rendering:pixelated;
}
.hud{
 display:flex;justify-content:center;gap:25px;
 flex-wrap:wrap;font-size:18px;font-weight:bold;
 margin:10px;
}
.controls{
 display:flex;justify-content:center;
 align-items:center;gap:18px;margin:15px;
}
button{
 border:0;border-radius:12px;padding:16px 23px;
 background:#00d9ff;color:#07152b;
 font-size:20px;font-weight:bold;
 box-shadow:0 5px #087b9b;
 touch-action:none;
}
button:active{transform:translateY(4px);box-shadow:0 1px #087b9b}
#jump{background:#ffca28}
#restart{font-size:15px;padding:12px 20px}
.help{color:#c5d4ff;font-size:14px;padding:5px 15px 20px}
</style>
</head>
<body>

<header>★ RETRO PIXEL ADVENTURE ★</header>

<div class="hud">
 <span>🪙 COINS: <span id="coins">0</span></span>
 <span>❤️ LIVES: <span id="lives">3</span></span>
 <span>🏆 SCORE: <span id="score">0</span></span>
</div>

<canvas id="game" width="960" height="540"></canvas>

<div class="controls">
 <button id="left">◀ LEFT</button>
 <button id="jump">⬆ JUMP</button>
 <button id="right">RIGHT ▶</button>
</div>
<button id="restart">↻ RESTART GAME</button>

<div class="help">
 Keyboard: A / D or ← / → to move • SPACE / W / ↑ to jump
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=960,H=540;
const worldWidth=3400;

let keys={left:false,right:false};
let camera=0,coins=0,score=0,lives=3;
let gameOver=false,won=false;
let last=0;

const player={
 x:70,y:350,w:32,h:42,
 vx:0,vy:0,speed:4.5,
 jump:-12.5,ground:false
};

const platforms=[
 {x:0,y:475,w:650,h:80},
 {x:740,y:475,w:480,h:80},
 {x:1300,y:475,w:530,h:80},
 {x:1910,y:475,w:490,h:80},
 {x:2480,y:475,w:920,h:80},

 {x:210,y:390,w:130,h:20},
 {x:440,y:325,w:130,h:20},
 {x:800,y:385,w:140,h:20},
 {x:1030,y:320,w:130,h:20},
 {x:1400,y:390,w:150,h:20},
 {x:1620,y:325,w:140,h:20},
 {x:1990,y:390,w:140,h:20},
 {x:2210,y:320,w:130,h:20},
 {x:2590,y:390,w:150,h:20},
 {x:2820,y:325,w:140,h:20}
];

let coinList=[];
for(let i=0;i<platforms.length;i++){
 const p=platforms[i];
 if(p.w>100 && p.y<470){
  coinList.push({
   x:p.x+p.w/2,y:p.y-38,taken:false
  });
 }
}
for(let i=0;i<20;i++){
 coinList.push({
  x:350+i*145,y:415-(i%3)*45,taken:false
 });
}

let enemies=[
 {x:380,y:443,w:32,h:32,v:1.5,min:350,max:610,alive:true},
 {x:880,y:443,w:32,h:32,v:1.7,min:780,max:1150,alive:true},
 {x:1490,y:443,w:32,h:32,v:1.6,min:1340,max:1770,alive:true},
 {x:2050,y:443,w:32,h:32,v:1.8,min:1940,max:2350,alive:true},
 {x:2690,y:443,w:32,h:32,v:1.6,min:2510,max:3300,alive:true}
];

function updateHUD(){
 document.getElementById("coins").textContent=coins;
 document.getElementById("score").textContent=score;
 document.getElementById("lives").textContent=lives;
}

function restart(){
 player.x=70;player.y=350;
 player.vx=0;player.vy=0;
 camera=0;coins=0;score=0;lives=3;
 gameOver=false;won=false;
 coinList.forEach(c=>c.taken=false);
 enemies.forEach(e=>e.alive=true);
 updateHUD();
}

function jump(){
 if(player.ground&&!gameOver&&!won){
  player.vy=player.jump;
  player.ground=false;
 }
}

function keyDown(e){
 if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))
  e.preventDefault();
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;
 if(e.key==="ArrowUp"||e.key===" "||e.key.toLowerCase()==="w"){
  if(!e.repeat)jump();
 }
}
function keyUp(e){
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;
}
window.addEventListener("keydown",keyDown);
window.addEventListener("keyup",keyUp);
window.addEventListener("blur",()=>{keys.left=false;keys.right=false;});

function holdButton(id,direction){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[direction]=true;
  b.setPointerCapture(e.pointerId);
 });
 const stop=e=>{e.preventDefault();keys[direction]=false;};
 b.addEventListener("pointerup",stop);
 b.addEventListener("pointercancel",stop);
 b.addEventListener("lostpointercapture",()=>keys[direction]=false);
}
holdButton("left","left");
holdButton("right","right");
document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();jump();
});
document.getElementById("restart").onclick=restart;

function collide(a,b){
 return a.x<b.x+b.w && a.x+a.w>b.x &&
        a.y<b.y+b.h && a.y+a.h>b.y;
}

function update(dt){
 if(gameOver||won)return;

 const oldY=player.y;
 const oldBottom=player.y+player.h;

 player.vx=0;
 if(keys.left)player.vx=-player.speed;
 if(keys.right)player.vx=player.speed;
 player.x+=player.vx*dt;

 player.x=Math.max(0,Math.min(worldWidth-player.w,player.x));

 player.vy+=0.55*dt;
 if(player.vy>14)player.vy=14;
 player.y+=player.vy*dt;
 player.ground=false;

 for(const p of platforms){
  if(player.x+player.w>p.x && player.x<p.x+p.w){
   if(oldBottom<=p.y && player.y+player.h>=p.y && player.vy>=0){
    player.y=p.y-player.h;
    player.vy=0;
    player.ground=true;
   }
  }
 }

 for(const c of coinList){
  if(!c.taken){
   const box={x:c.x-12,y:c.y-12,w:24,h:24};
   if(collide(player,box)){
    c.taken=true;coins++;score+=10;updateHUD();
   }
  }
 }

 for(const e of enemies){
  if(!e.alive)continue;
  e.x+=e.v*dt;
  if(e.x<e.min||e.x>e.max)e.v*=-1;

  if(collide(player,e)){
   if(player.vy>0 && oldBottom<=e.y+12){
    e.alive=false;
    player.vy=-8;
    score+=50;
    updateHUD();
   }else{
    loseLife();
   }
  }
 }

 if(player.y>H+100)loseLife();

 if(player.x>worldWidth-110){
  won=true;
 }
 camera=Math.max(0,Math.min(worldWidth-W,player.x-350));
}

function loseLife(){
 lives--;
 updateHUD();
 if(lives<=0){
  gameOver=true;
 }else{
  player.x=Math.max(70,player.x-100);
  player.y=300;
  player.vx=0;player.vy=0;
 }
}

function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}

function drawBackground(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#54caff");
 sky.addColorStop(1,"#e1f9ff");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // distant mountains
 for(let i=0;i<9;i++){
  let x=i*430-camera*.25;
  ctx.fillStyle="#72b9a4";
  ctx.beginPath();
  ctx.moveTo(x-100,475);
  ctx.lineTo(x+120,220+(i%3)*45);
  ctx.lineTo(x+340,475);
  ctx.fill();
 }
 // clouds
 for(let i=0;i<12;i++){
  let x=(i*330-camera*.4)%(W+150);
  if(x<0)x+=W+150;
  ctx.fillStyle="rgba(255,255,255,.9)";
  ctx.fillRect(x,75+(i%3)*50,65,22);
  ctx.fillRect(x+15,60+(i%3)*50,35,35);
 }
}

function drawWorld(){
 ctx.save();
 ctx.translate(-camera,0);

 // ground and platforms
 for(const p of platforms){
  rect(p.x,p.y,p.w,p.h,"#8b4a24");
  rect(p.x,p.y,p.w,12,"#39d353");
  for(let x=p.x;x<p.x+p.w;x+=32){
   rect(x,p.y+18,16,12,"#b86b36");
   rect(x+16,p.y+34,16,12,"#65391f");
  }
 }

 // coins
 for(const c of coinList){
  if(c.taken)continue;
  ctx.fillStyle="#ffd52e";
  ctx.beginPath();
  ctx.arc(c.x,c.y,11,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#ff9e00";ctx.lineWidth=3;ctx.stroke();
  rect(c.x-2,c.y-7,4,14,"#fff3a0");
 }

 // enemies
 for(const e of enemies){
  if(!e.alive)continue;
  rect(e.x,e.y+8,32,24,"#9b43ce");
  rect(e.x+4,e.y,24,16,"#d477ff");
  rect(e.x+6,e.y+12,6,7,"white");
  rect(e.x+20,e.y+12,6,7,"white");
  rect(e.x+8,e.y+14,3,4,"#111");
  rect(e.x+22,e.y+14,3,4,"#111");
  rect(e.x+3,e.y+28,9,4,"#392050");
  rect(e.x+21,e.y+28,9,4,"#392050");
 }

 // finish flag
 rect(worldWidth-90,300,9,175,"#444");
 rect(worldWidth-81,300,65,42,"#ff405d");
 rect(worldWidth-81,342,65,42,"#fff");
 rect(worldWidth-81,384,65,42,"#32c96b");

 // player character
 const x=player.x,y=player.y;
 // shoes
 rect(x+2,y+35,12,7,"#30204d");
 rect(x+19,y+35,12,7,"#30204d");
 // body
 rect(x+4,y+17,25,18,"#ff7a21");
 rect(x+4,y+17,25,5,"#ffd23c");
 // face
 rect(x+5,y+5,23,16,"#ffca91");
 // hair
 rect(x+3,y+2,27,8,"#46251d");
 rect(x+1,y+8,7,10,"#46251d");
 // eyes
 rect(x+20,y+10,3,4,"#202044");
 // cap
 rect(x+3,y-1,25,7,"#ed314e");
 rect(x+20,y+4,13,4,"#ed314e");
 // backpack
 rect(x,y+19,6,13,"#3865e8");

 ctx.restore();
}

function drawOverlay(){
 if(!gameOver&&!won)return;
 ctx.fillStyle="rgba(5,8,25,.78)";
 ctx.fillRect(0,0,W,H);
 ctx.textAlign="center";
 ctx.fillStyle=won?"#ffe04a":"#ff506c";
 ctx.font="bold 48px Arial";
 ctx.fillText(won?"LEVEL COMPLETE!":"GAME OVER",W/2,220);
 ctx.fillStyle="white";
 ctx.font="bold 24px Arial";
 ctx.fillText("Score: "+score+"   Coins: "+coins,W/2,275);
 ctx.font="20px Arial";
 ctx.fillText("Press RESTART to play again",W/2,330);
}

function draw(){
 drawBackground();
 drawWorld();
 drawOverlay();
}

function loop(time){
 const dt=Math.min((time-last)/16.67||1,2);
 last=time;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
